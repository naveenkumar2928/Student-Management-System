<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('dashboard') }}">
            Student Management System
        </a>

        <div>
            <a href="{{ url_for('dashboard') }}"
               class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

            <a href="{{ url_for('students') }}"
               class="btn btn-outline-light btn-sm">
                Students
            </a>
        </div>

    </div>
</nav>


<div class="container mt-4">

    <div class="card shadow">

        <div class="card-body">

            <h3 class="mb-4">Edit Student</h3>

            <form method="POST">

                <div class="row">

                    <!-- Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student['Name'] }}"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ student['Email'] }}"
                               required>

                    </div>


                    <!-- Department -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select name="department"
                                class="form-control"
                                required>

                            <option value="AI"
                                {% if student['Department'] == 'AI' %}
                                selected
                                {% endif %}>
                                AI
                            </option>

                            <option value="IT"
                                {% if student['Department'] == 'IT' %}
                                selected
                                {% endif %}>
                                IT
                            </option>

                            <option value="DS"
                                {% if student['Department'] == 'DS' %}
                                selected
                                {% endif %}>
                                DS
                            </option>

                        </select>

                    </div>


                    <!-- Year -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Year
                        </label>

                        <select name="year"
                                class="form-control"
                                required>

                            <option value="1st"
                                {% if student['year'] == '1st' %}
                                selected
                                {% endif %}>
                                1st
                            </option>

                            <option value="2nd"
                                {% if student['year'] == '2nd' %}
                                selected
                                {% endif %}>
                                2nd
                            </option>

                            <option value="3rd"
                                {% if student['year'] == '3rd' %}
                                selected
                                {% endif %}>
                                3rd
                            </option>

                            <option value="4th"
                                {% if student['year'] == '4th' %}
                                selected
                                {% endif %}>
                                4th
                            </option>

                        </select>

                    </div>


                    <!-- Marks -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Marks
                        </label>

                        <input type="number"
                               name="marks"
                               class="form-control"
                               value="{{ student['Marks'] }}"
                               required>

                    </div>


                    <!-- Attendance -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Attendance
                        </label>

                        <input type="number"
                               name="attendance"
                               class="form-control"
                               value="{{ student['Attendance'] }}"
                               min="0"
                               max="100"
                               required>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="mt-3">

                    <button type="submit"
                            class="btn btn-primary">
                        Update Student
                    </button>

                    <a href="{{ url_for('students') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
